<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 전날리포트 · 미리토퍼캐슬</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 60px;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: #f4f5f8; color: #1a1a2e;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: #888; font-size: .8rem; margin-bottom: 18px; }

  /* ===== 디데이 ===== */
  .dday-bar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: #fff; border-radius: 16px; padding: 18px 20px; margin-bottom: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .dday-chip {
    display: flex; align-items: center; gap: 9px;
    background: #f0eeff; border-radius: 26px; padding: 10px 16px 10px 18px;
    font-size: 1rem; font-weight: 700; color: #5b3fd6; white-space: nowrap;
  }
  .dday-chip .n { font-size: 1.15rem; font-weight: 800; }
  .dday-chip .x {
    cursor: pointer; color: #b0a8e0; font-weight: 400; padding: 0 3px; font-size: 1rem;
  }
  .dday-chip .x:hover { color: #e03131; }
  .dday-add {
    border: 1.5px dashed #ccc; border-radius: 26px; padding: 10px 18px;
    font-size: .92rem; color: #999; cursor: pointer; background: none;
  }
  .dday-add:hover { border-color: #999; color: #666; }
  .dday-form {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: #fafbfd; border: 1.5px solid #e3e6ee; border-radius: 14px; padding: 10px 12px;
  }
  .dday-form input[type="text"] {
    border: 1px solid #ddd; border-radius: 8px; padding: 8px 10px; font-size: .9rem;
    width: 130px; font-family: inherit;
  }
  .dday-form input[type="date"] {
    border: 1px solid #ddd; border-radius: 8px; padding: 7px 10px; font-size: .88rem; font-family: inherit;
  }
  .dday-form button {
    border: none; border-radius: 8px; padding: 8px 14px; font-size: .88rem; font-weight: 700; cursor: pointer;
  }
  .dday-form .ok { background: #5b3fd6; color: #fff; }
  .dday-form .cancel { background: #eee; color: #888; }

  /* ===== 공통 섹션 ===== */
  .section {
    background: #fff; border-radius: 16px; padding: 18px 20px; margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .section-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .section-head h2 { font-size: 1rem; margin: 0; }
  .section-head .tools { display: flex; gap: 6px; }
  .brand-btn {
    border: 1px solid #ddd; background: #fff; border-radius: 8px; padding: 4px 10px;
    font-size: .75rem; cursor: pointer; color: #666;
  }
  .brand-btn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
  .loading { color: #aaa; font-size: .85rem; padding: 20px 0; text-align: center; }

  /* ===== 그로스매출 ===== */
  .gross-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .gross-card { border-radius: 12px; padding: 14px 16px; background: #fafbfd; border: 1px solid #eee; }
  .gross-card .name { font-size: .82rem; color: #888; font-weight: 700; margin-bottom: 4px; }
  .gross-card .val { font-size: 1.4rem; font-weight: 800; }
  .gross-card .rank {
    display: inline-block; margin-top: 6px; font-size: .72rem; font-weight: 800;
    padding: 2px 8px; border-radius: 10px; color: #fff;
  }
  .gross-card .note { font-size: .72rem; color: #aaa; margin-top: 4px; }

  /* ===== 매출 요약 카드 (기존 coupang.html 요약 스타일과 동일 톤) ===== */
  .sum-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 10px; margin-top: 8px; }
  .sum-card { background: #fafbfd; border: 1px solid #eee; border-radius: 10px; padding: 10px 12px; }
  .sum-card .label { font-size: .7rem; color: #999; margin-bottom: 3px; }
  .sum-card .v { font-size: .98rem; font-weight: 800; }
  .sum-card .v.rev { color: #1c7ed6; }
  .sum-card .v.cost { color: #e03131; }
  .sum-card .v.grand { color: #2f9e44; }
  .sum-card .avg { font-size: .78rem; color: #666; font-weight: 700; margin-top: 4px; }
  .yoil-compare {
    margin-top: 14px; display: flex; gap: 12px; flex-wrap: wrap;
  }
  .yoil-box {
    flex: 1; min-width: 200px; background: #fafbfd; border: 1px solid #eee; border-radius: 10px; padding: 12px 14px;
  }
  .yoil-box .t { font-size: .78rem; color: #888; margin-bottom: 6px; }
  .yoil-box .v { font-size: 1.15rem; font-weight: 800; }
  .yoil-box .cmp { font-size: .8rem; font-weight: 700; margin-left: 6px; }
  .cmp.up { color: #2f9e44; } .cmp.down { color: #e03131; } .cmp.flat { color: #999; }

  /* ===== 광고관리 Top20 박스 ===== */
  .ad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .ad-box { border: 1px solid #eee; border-radius: 12px; overflow: hidden; }
  .ad-box .hd { padding: 8px 12px; font-size: .8rem; font-weight: 800; color: #fff; }
  .ad-box.bad .hd { background: #e03131; }
  .ad-box.cost .hd { background: #f08c00; }
  .ad-box.good .hd { background: #1c7ed6; }
  .ad-list { max-height: 320px; overflow-y: auto; }
  .ad-row {
    display: flex; justify-content: space-between; gap: 8px; padding: 7px 12px;
    border-bottom: 1px solid #f2f2f2; font-size: .76rem;
  }
  .ad-row:last-child { border-bottom: none; }
  .ad-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333; }
  .ad-row .v { flex-shrink: 0; font-weight: 700; color: #555; text-align: right; }
  .ad-empty { padding: 20px; text-align: center; color: #bbb; font-size: .8rem; }

  /* ===== 주문관리 ===== */
  .order-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .order-col { border: 1px solid #eee; border-radius: 12px; overflow: hidden; }
  .order-col .hd {
    padding: 10px 14px; font-weight: 800; font-size: .88rem; display: flex; justify-content: space-between;
  }
  .order-col.cp .hd { background: #fff3e0; color: #e8590c; }
  .order-col.nv .hd { background: #e7f5ff; color: #1c7ed6; }
  .order-list { max-height: 280px; overflow-y: auto; }
  .order-row {
    display: flex; justify-content: space-between; gap: 8px; padding: 7px 14px;
    border-bottom: 1px solid #f5f5f5; font-size: .78rem;
  }
  .order-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-row .q { flex-shrink: 0; font-weight: 700; color: #666; }

  .updated-at { text-align: center; color: #bbb; font-size: .72rem; margin-top: 20px; }

  @media (max-width: 700px) {
    .gross-grid, .order-grid { grid-template-columns: 1fr; }
    .ad-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 전날리포트</h1>
  <div class="sub" id="todayLabel"></div>

  <div class="dday-bar" id="ddayBar">
    <span class="loading">디데이 불러오는 중...</span>
  </div>

  <div class="section">
    <div class="section-head"><h2>💰 매출</h2></div>
    <div class="sum-grid" id="topSumGrid" style="margin-bottom:14px"><div class="loading">불러오는 중...</div></div>
    <div class="yoil-compare" id="yoilCompare"></div>
    <div id="salesSummaryLabel" class="sub" style="margin:14px 0 0"></div>
    <div class="sum-grid" id="sumGrid"><div class="loading">불러오는 중...</div></div>
  </div>

  <div class="section">
    <div class="section-head"><h2>📦 그로스매출 (어제)</h2></div>
    <div class="gross-grid" id="grossGrid"><div class="loading">불러오는 중...</div></div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>📢 광고관리 (최근 5일)</h2>
      <div class="tools">
        <button class="brand-btn active" data-brand="miri" onclick="switchAdBrand('miri')">미리토퍼</button>
        <button class="brand-btn" data-brand="mong" onclick="switchAdBrand('mong')">몽몽토퍼</button>
      </div>
    </div>
    <div class="ad-grid" id="adGrid"><div class="loading">불러오는 중...</div></div>
  </div>

  <div class="section">
    <div class="section-head"><h2>🧾 주문관리 (어제)</h2></div>
    <div class="order-grid" id="orderGrid"><div class="loading">불러오는 중...</div></div>
  </div>

  <div class="updated-at" id="updatedAt"></div>
</div>

<script>
const FB_DDAY = 'https://my-workspace-b1b7a-default-rtdb.firebaseio.com/ws5/dday_list.json';

const RANK_COLORS = ['#1B5E20','#66BB6A','#F57F17','#EF5350','#B71C1C'];
const RANK_LABELS = ['1위(상위 20%)','2위','3위','4위','5위(하위 20%)'];
const WD = ['일','월','화','수','목','금','토'];

function fmtWon(n){ return Math.round(n||0).toLocaleString('ko-KR') + '원'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function yesterdayMD(){
  const d = new Date(); d.setDate(d.getDate()-1);
  return { mm: String(d.getMonth()+1).padStart(2,'0'), dd: String(d.getDate()).padStart(2,'0'),
           md: `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,
           date: d };
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${WD[d.getDay()]})`;
}
document.getElementById('todayLabel').textContent = todayStr() + ' 기준';

/* ===================== 디데이 ===================== */
let ddayList = [];
async function loadDday(){
  try{
    const r = await fetch(FB_DDAY + '?t=' + Date.now());
    const d = await r.json();
    ddayList = Array.isArray(d) ? d : (d ? Object.values(d) : []);
  }catch(e){ ddayList = []; }
  renderDday();
}
function saveDday(){
  fetch(FB_DDAY, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ddayList) })
    .catch(()=>{});
}
let ddayFormOpen = false;
function renderDday(){
  const box = document.getElementById('ddayBar');
  const today = new Date(); today.setHours(0,0,0,0);
  const chips = ddayList.slice().sort((a,b)=> a.date.localeCompare(b.date)).map(item => {
    const target = new Date(item.date + 'T00:00:00');
    const diff = Math.round((target - today) / 86400000);
    const n = diff === 0 ? 'D-DAY' : (diff > 0 ? `D-${diff}` : `D+${-diff}`);
    return `<span class="dday-chip">${esc(item.title)} <span class="n">${n}</span>
      <span class="x" onclick="removeDday('${item.id}')" title="삭제">✕</span></span>`;
  }).join('');
  const addUi = ddayFormOpen
    ? `<div class="dday-form">
        <input type="text" id="ddayTitleInput" placeholder="이름 (예: 추석)" maxlength="20">
        <input type="date" id="ddayDateInput">
        <button class="ok" onclick="confirmAddDday()">추가</button>
        <button class="cancel" onclick="cancelAddDday()">취소</button>
      </div>`
    : `<button class="dday-add" onclick="openDdayForm()">+ 디데이 추가</button>`;
  box.innerHTML = chips + addUi;
  if(ddayFormOpen){
    document.getElementById('ddayTitleInput').focus();
    document.getElementById('ddayDateInput').addEventListener('keydown', e => {
      if(e.key === 'Enter') confirmAddDday();
    });
    document.getElementById('ddayTitleInput').addEventListener('keydown', e => {
      if(e.key === 'Enter') document.getElementById('ddayDateInput').focus();
    });
  }
}
function openDdayForm(){ ddayFormOpen = true; renderDday(); }
function cancelAddDday(){ ddayFormOpen = false; renderDday(); }
function confirmAddDday(){
  const title = document.getElementById('ddayTitleInput').value.trim();
  const dateStr = document.getElementById('ddayDateInput').value;
  if(!title){ alert('이름을 적어주세요'); return; }
  if(!dateStr){ alert('날짜를 골라주세요'); return; }
  ddayList.push({ id: 'd'+Date.now(), title, date: dateStr });
  ddayFormOpen = false;
  saveDday(); renderDday();
}
function removeDday(id){
  ddayList = ddayList.filter(x => x.id !== id);
  saveDday(); renderDday();
}

/* ===================== 매출 / 그로스 (coupang_data.json + 매출.html 수동보정) =====================
   매출.html(coupang.html)에서 광고비/네이버매출/그로스매출을 수동으로 고치면 coupang_data.json이
   아니라 Firebase(FB_MANUAL_AD)에 저장된다 — 여기서도 그걸 똑같이 읽어서 덮어써야
   대시보드에 수동 보정이 반영된다 (2026-09-12 실제 지적받음). */
const FB_MANUAL_AD = 'https://my-workspace-b1b7a-default-rtdb.firebaseio.com/ws5/coupang_manual_ad.json';
let coupangData = null;
let mergedAdData = {};  // coupang.html 의 adData 와 동일한 병합 결과 (날짜 'MM/DD' 키)

async function loadCoupangData(){
  let manualAdData = {};
  try{
    const [r, fbR] = await Promise.all([
      fetch('coupang_data.json?t=' + Date.now()),
      fetch(FB_MANUAL_AD + '?t=' + Date.now()).catch(()=>null),
    ]);
    coupangData = await r.json();
    if(fbR && fbR.ok){
      const fb = await fbR.json();
      if(fb && typeof fb === 'object'){
        for(const [k,v] of Object.entries(fb)) manualAdData[k.replace(/_/g,'/')] = v;
      }
    }
  }catch(e){ coupangData = null; }

  mergedAdData = {};
  if(coupangData){
    const jsonAdData = coupangData.ad_data || {};
    for(const date of new Set([...Object.keys(jsonAdData), ...Object.keys(manualAdData)])){
      const merged = Object.assign({}, jsonAdData[date] || {});
      for(const [k,v] of Object.entries(manualAdData[date] || {})){
        if(v !== 0 && v !== null && v !== undefined) merged[k] = v;
      }
      mergedAdData[date] = merged;
    }
  }
  renderTopSummary();
  renderGross();
  renderSalesYoil();
  renderSalesSummary();
}

/* 쿠팡 그로스매출(로켓+판매자배송), 매출.html 의 수동 보정(manualRg/manualSd, mong은 mongRg/mongSd)을
   반영한 최종값. rows 원본은 안 건드리고 그때그때 계산한다. */
function getRgSd(brandLabel, date){
  const isMong = brandLabel === '몽몽토퍼';
  const fRg = isMong ? 'mongRg' : 'manualRg';
  const fSd = isMong ? 'mongSd' : 'manualSd';
  const rows = (coupangData && coupangData.sales_data && coupangData.sales_data[brandLabel]) || [];
  const m = rows.find(r => r.date === date) || {};
  const ad = mergedAdData[date] || {};
  const has = v => v !== undefined && v !== null && v !== '';
  const rg = has(ad[fRg]) ? ad[fRg] : (m.rocket_growth || 0);
  const sd = has(ad[fSd]) ? ad[fSd] : (m.seller_delivery || 0);
  return { rg, sd, total: rg + sd, hasRow: !!rows.find(r => r.date === date) };
}

/* 매출 섹션 맨 위: 어제 총매출 · 광고비 · 광고비중 (쿠팡+네이버, 미리토퍼 기준) */
function renderTopSummary(){
  const grid = document.getElementById('topSumGrid');
  if(!coupangData){ grid.innerHTML = '<div class="ad-empty">데이터 없음</div>'; return; }
  const y = yesterdayMD();
  const ad = mergedAdData[y.md] || {};
  const cpTotal = getRgSd('미리토퍼', y.md).total;
  const naverSales = ad.naverSales || 0;
  const naverAdCost = (ad.naverSearchAd||0) + (ad.naverAiAd||0);
  const cpAdCost = ad.cpAdCost || 0;
  const totalSales = cpTotal + naverSales;
  const totalAdCost = cpAdCost + naverAdCost;
  const adPct = totalSales ? (totalAdCost/totalSales*100) : null;

  const isMissing = v => v === undefined || v === null;
  const salesMissing = [];
  if(isMissing(ad.naverSales)) salesMissing.push('네이버 매출');
  const adMissing = [];
  if(isMissing(ad.cpAdCost)) adMissing.push('쿠팡 광고비');
  if(isMissing(ad.naverSearchAd)) adMissing.push('네이버 검색광고');
  if(isMissing(ad.naverAiAd)) adMissing.push('네이버 AI광고');
  const warn = list => list.length
    ? `<div style="font-size:.68rem;color:#e8590c;font-weight:700;margin-top:4px">⚠️ ${list.join(', ')} 미수집 — 실제보다 적게 잡힘</div>` : '';

  const breakdown = (cp, nv) => `<div style="font-size:.78rem;color:#777;margin-top:5px">
      🟠 쿠팡 ${fmtWon(cp)} <span style="color:#ccc">·</span> 🟢 네이버 ${fmtWon(nv)}
    </div>`;

  const card = (label, val, cls, extra, sub) => `<div class="sum-card">
      <div class="label">${label}</div>
      <div class="v ${cls}">${fmtWon(val)}${extra||''}</div>
      ${sub||''}
    </div>`;
  grid.innerHTML =
    card('어제 총매출', totalSales, 'grand', '', breakdown(cpTotal, naverSales) + warn(salesMissing)) +
    card('어제 총광고비', totalAdCost, 'cost',
      adPct !== null ? ` <span style="font-size:.72rem;color:#999">(광고비중 ${adPct.toFixed(1)}%)</span>` : '',
      breakdown(cpAdCost, naverAdCost) + warn(adMissing));
}

function quintileRank(rows, dateStr){
  const vals = rows.map(r => ({ d:r.date, v:r.total })).filter(x => x.v);
  vals.sort((a,b)=>b.v-a.v);
  const n = vals.length;
  const idx = vals.findIndex(x => x.d === dateStr);
  if(idx < 0 || n < 2) return null;
  return Math.min(4, Math.floor(idx / n * 5));
}

function renderGross(){
  const grid = document.getElementById('grossGrid');
  if(!coupangData){ grid.innerHTML = '<div class="ad-empty">매출 데이터를 못 불러왔어요</div>'; return; }
  const y = yesterdayMD();
  const brands = [['미리토퍼','miri'], ['몽몽토퍼','mong']];
  grid.innerHTML = brands.map(([label]) => {
    const rows = (coupangData.sales_data && coupangData.sales_data[label]) || [];
    const cur = getRgSd(label, y.md);
    const val = cur.hasRow ? cur.total : null;
    // 순위 비교용: 원래 날짜들에 보정값을 반영한 total 목록
    const corrected = rows.map(r => ({ date: r.date, total: getRgSd(label, r.date).total }));
    const rank = cur.hasRow ? quintileRank(corrected, y.md) : null;
    const rankHtml = rank !== null
      ? `<div class="rank" style="background:${RANK_COLORS[rank]}">${RANK_LABELS[rank]}</div>`
      : `<div class="note">순위 계산 불가</div>`;
    return `<div class="gross-card">
      <div class="name">${label}</div>
      <div class="val">${val !== null ? fmtWon(val) : '데이터 없음'}</div>
      ${val !== null ? rankHtml : ''}
    </div>`;
  }).join('');
}

/* 전날 vs 같은 요일 과거 평균 */
function renderSalesYoil(){
  const box = document.getElementById('yoilCompare');
  if(!coupangData){ box.innerHTML=''; return; }
  const y = yesterdayMD();
  const dow = WD[y.date.getDay()];
  const brands = [['미리토퍼','miri'], ['몽몽토퍼','mong']];
  box.innerHTML = brands.map(([label]) => {
    const rows = (coupangData.sales_data && coupangData.sales_data[label]) || [];
    const yVal = getRgSd(label, y.md).total;
    // 같은 요일 과거 데이터(어제 제외, 최근 8회) — 보정값 반영
    const sameDow = rows.filter(r => {
      if(r.date === y.md) return false;
      const [mm,dd] = r.date.split('/').map(Number);
      const dt = new Date(2026, mm-1, dd);
      return WD[dt.getDay()] === dow;
    }).sort((a,b)=> b.date.localeCompare(a.date)).slice(0,8)
      .map(r => ({ date: r.date, total: getRgSd(label, r.date).total }));
    const avg = sameDow.length ? sameDow.reduce((s,r)=>s+r.total,0)/sameDow.length : null;
    let cmpHtml = '';
    if(avg){
      const pct = ((yVal-avg)/avg*100);
      const cls = pct > 3 ? 'up' : (pct < -3 ? 'down' : 'flat');
      const arrow = pct > 3 ? '▲' : (pct < -3 ? '▼' : '-');
      cmpHtml = `<span class="cmp ${cls}">${arrow} ${Math.abs(pct).toFixed(0)}%</span>`;
    }
    return `<div class="yoil-box">
      <div class="t">${label} · 어제(${dow}) vs 최근 ${sameDow.length}번의 ${dow}요일 평균</div>
      <span class="v">${fmtWon(yVal)}</span>${cmpHtml}
      ${avg ? `<div class="note" style="color:#aaa;font-size:.7rem;margin-top:4px">${dow}요일 평균 ${fmtWon(avg)}</div>` : ''}
    </div>`;
  }).join('');
}

/* 이번달 요약 (coupang.html 요약 카드와 동일 계산) */
function renderSalesSummary(){
  const grid = document.getElementById('sumGrid');
  const labelEl = document.getElementById('salesSummaryLabel');
  if(!coupangData){ grid.innerHTML = '<div class="ad-empty">데이터 없음</div>'; return; }
  const nowMM = String(new Date().getMonth()+1).padStart(2,'0');
  labelEl.textContent = parseInt(nowMM) + '월 요약 (미리토퍼 기준)';
  const rows = (coupangData.sales_data && coupangData.sales_data['미리토퍼']) || [];
  const sumDates = rows.map(r=>r.date).filter(d => d.startsWith(nowMM));
  const sum = { rg:0, sd:0, total:0, cpAdCost:0, naverSales:0, naverSearchAd:0, naverAiAd:0 };
  sumDates.forEach(d => {
    const rs = getRgSd('미리토퍼', d); const ad = mergedAdData[d] || {};
    sum.rg += rs.rg; sum.sd += rs.sd; sum.total += rs.total;
    sum.cpAdCost += ad.cpAdCost||0; sum.naverSales += ad.naverSales||0;
    sum.naverSearchAd += ad.naverSearchAd||0; sum.naverAiAd += ad.naverAiAd||0;
  });
  const totalSales = sum.total + sum.naverSales;
  const totalAdCost = sum.cpAdCost + sum.naverSearchAd + sum.naverAiAd;
  const dayCount = sumDates.length;
  const pctOf = v => totalSales ? ` <span style="font-size:.68rem;color:#999">(${(v/totalSales*100).toFixed(0)}%)</span>` : '';
  const avgHtml = v => dayCount ? `<div class="avg">일평균 ${fmtWon(v/dayCount)}</div>` : '';
  const card = (label, val, cls, pct) => `<div class="sum-card">
      <div class="label">${label}</div>
      <div class="v ${cls}">${fmtWon(val)}${pct||''}</div>
      ${avgHtml(val)}
    </div>`;
  grid.innerHTML = [
    card('쿠팡 그로스', sum.rg, 'rev', pctOf(sum.rg)),
    card('쿠팡 판매자배송', sum.sd, 'rev', pctOf(sum.sd)),
    card('쿠팡 총매출', sum.total, 'rev', pctOf(sum.total)),
    card('쿠팡 광고비', sum.cpAdCost, 'cost', ''),
    card('네이버 총매출', sum.naverSales, 'rev', pctOf(sum.naverSales)),
    card('네이버 광고비', sum.naverSearchAd+sum.naverAiAd, 'cost', ''),
    card('전체 총광고비', totalAdCost, 'cost', ''),
    card('전체 총매출', totalSales, 'grand', ''),
  ].join('');
}

/* ===================== 광고관리 Top20 · 주문관리 (사무실 PC가 매일 Firebase에 미리 계산해서 올려둠) =====================
   원래는 사무실 서버(사설망, http)를 브라우저에서 직접 불러왔는데, 대시보드가 GitHub Pages(https)라
   브라우저가 보안 정책(Private Network Access)으로 막아버렸다 — 특히 폰에서.
   그래서 morning_summary_push.py 가 매일 광고데이터 갱신 직후 요약을 Firebase에 올려두고,
   여기서는 그 요약만 읽는다 (사무실 서버 접속 불필요, 커스텀 도메인 인증서 상태와도 무관). */
const FB_SUMMARY = 'https://my-workspace-b1b7a-default-rtdb.firebaseio.com/ws5/morning_summary.json';
let summaryData = null;
let adBrand = 'miri';

async function loadSummary(){
  try{
    const r = await fetch(FB_SUMMARY + '?t=' + Date.now());
    summaryData = await r.json();
  }catch(e){ summaryData = null; }
}
function switchAdBrand(b){
  adBrand = b;
  document.querySelectorAll('.brand-btn').forEach(x => x.classList.toggle('active', x.dataset.brand===b));
  renderAdTop20();
}
function renderAdTop20(){
  const grid = document.getElementById('adGrid');
  const ad = summaryData && summaryData.ad && summaryData.ad[adBrand];
  if(!ad){ grid.innerHTML = '<div class="ad-empty">광고 요약 데이터가 없어요</div>'; return; }
  const box = (title, cls, rows, valFn) => `
    <div class="ad-box ${cls}">
      <div class="hd">${title}</div>
      <div class="ad-list">
        ${rows && rows.length ? rows.map(x => `<div class="ad-row"><span class="nm" title="${esc(x.fullName||x.name)}">${esc(x.name)}</span><span class="v">${valFn(x)}</span></div>`).join('')
                      : '<div class="ad-empty">데이터 없음</div>'}
      </div>
    </div>`;
  grid.innerHTML =
    box('🔴 수익률(ROAS) 낮은 순 Top20', 'bad', ad.badRoas, x => x.roas!==null ? Math.round(x.roas)+'%' : '-') +
    box('🟠 광고비 많이 쓴 순 Top20', 'cost', ad.topCost, x => fmtWon(x.cost)) +
    box('🔵 수익률(ROAS) 높은 순 Top20', 'good', ad.goodRoas, x => x.roas!==null ? Math.round(x.roas)+'%' : '-');
}

/* ===================== 주문관리 (어제, 쿠팡/네이버) ===================== */
function renderOrders(){
  const grid = document.getElementById('orderGrid');
  const o = summaryData && summaryData.orders;
  if(!o){ grid.innerHTML = '<div class="ad-empty">주문 요약 데이터가 없어요</div>'; return; }
  const col = (label, cls, bucket) => `
    <div class="order-col ${cls}">
      <div class="hd"><span>${label}</span><span>${(bucket&&bucket.count)||0}건</span></div>
      <div class="order-list">
        ${bucket && bucket.items && bucket.items.length ? bucket.items.map(x => `<div class="order-row"><span class="nm" title="${esc(x.name)}">${esc(x.name)}</span><span class="q">${x.qty}개</span></div>`).join('')
                      : '<div class="ad-empty">주문 없음</div>'}
      </div>
    </div>`;
  grid.innerHTML = col('🟠 쿠팡', 'cp', o.cp) + col('🟢 네이버', 'nv', o.nv);
}

/* ===================== 초기 로드 ===================== */
(async function init(){
  loadDday();
  await loadCoupangData();
  await loadSummary();
  renderAdTop20();
  renderOrders();
  document.getElementById('updatedAt').textContent = '새로고침: ' + new Date().toLocaleString('ko-KR')
    + (summaryData && summaryData.updated ? ` · 광고/주문 요약: ${summaryData.updated}` : '');
})();
</script>
