<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* http로 들어오면 https로 (다운로드 경고 방지) */ if(location.protocol==='http:' && !/^(localhost|127\.)/.test(location.hostname)) location.replace('https://'+location.host+location.pathname+location.search);</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>몽글 · 사진 필터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f4f2; --surface:#ffffff; --stage:#ebe8e4; --line:#e7e4e0;
    --ink:#1c1917; --sub:#57534e; --mute:#a8a29e;
    --acc:#ff6b57; --acc-soft:#ffebe6; --brown:#5a3a22; --cream:#fff7ec;
    --font:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none; font-family:var(--font); letter-spacing:-.2px}
  button{font-family:inherit; letter-spacing:inherit}
  svg{display:block}
  .app{height:100dvh; display:flex; flex-direction:column; max-width:640px; margin:0 auto; position:relative}

  /* 상단 */
  .top{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:calc(6px + env(safe-area-inset-top)) 14px 6px; height:calc(50px + env(safe-area-inset-top))}
  .logo{display:flex; align-items:center; gap:5px; white-space:nowrap}
  .logo svg{flex:0 0 auto}
  .logo b{font-family:'Jua',var(--font); font-weight:400; font-size:22px; letter-spacing:-.3px; color:var(--brown)}
  .logo b i{font-style:normal; color:var(--acc)}
  .logo small{font-size:10.5px; color:var(--mute); font-weight:600; align-self:flex-end; margin-bottom:3px}
  .top .sp{flex:1}
  .pill{border:none; border-radius:10px; padding:9px 13px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:5px}
  .pill.ghost{background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line)}
  .pill.main{background:var(--brown); color:#fff}
  .pill:active{opacity:.8}
  @media (max-width:420px){ .barBtn.ico span{display:none} .barBtn.ico{padding:0 8px} .bar{gap:5px; padding:6px 8px} }
  @media (max-width:400px){ .top{gap:4px; padding-left:12px; padding-right:10px} .pill{padding:8px 10px} .icoBtn{width:32px} }
  .icoBtn{width:36px; height:36px; border:none; border-radius:10px; background:transparent; color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer}
  .icoBtn:disabled{color:#d4d4d8; cursor:default}
  .icoBtn:not(:disabled):active{background:var(--line)}
  .pill:disabled{opacity:.5}

  /* 사진 영역 */
  .stage{flex:1 1 auto; min-height:0; position:relative; overflow:hidden; background:var(--stage); touch-action:none; user-select:none; -webkit-user-select:none}
  .wrap{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform}
  .wrap canvas,.wrap img{position:absolute; inset:0; width:100%; height:100%; display:block; -webkit-user-drag:none; pointer-events:none}
  .wrap img.orig{opacity:0}
  .stage.cmp .wrap img.orig{opacity:1}
  .glass{background:rgba(24,24,27,.55); color:#fff; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
  .badge{display:none!important}
  .zoomTag{position:absolute; left:50%; top:12px; transform:translateX(-50%); font-size:12px; font-weight:600; padding:4px 9px; border-radius:7px; pointer-events:none; opacity:0; transition:opacity .3s}
  .zoomTag.show{opacity:1}
  .hint{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); font-size:12px; padding:6px 11px; border-radius:8px; pointer-events:none; white-space:nowrap; transition:opacity .5s}
  .spin{position:absolute; right:14px; top:14px; width:22px; height:22px; border-radius:50%; border:2.5px solid rgba(255,255,255,.5); border-top-color:var(--acc); display:none; animation:rot .7s linear infinite; pointer-events:none}
  .busy .spin{display:block}
  @keyframes rot{to{transform:rotate(360deg)}}
  /* 도구 줄 (사진 아래) */
  .bar{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:6px 10px; background:var(--surface); border-bottom:1px solid var(--line)}
  .thumbs{flex:1 1 auto; min-width:0; display:flex; gap:6px; overflow-x:auto; padding:5px 6px 2px 2px; scrollbar-width:none}
  .thumbs::-webkit-scrollbar{display:none}
  .thumbs .t{position:relative; flex:0 0 auto; width:32px; height:32px; border-radius:7px; cursor:pointer; opacity:.55; box-shadow:inset 0 0 0 1px var(--line)}
  .thumbs .t.on{opacity:1; box-shadow:0 0 0 2px var(--acc)}
  .thumbs .t img{width:100%; height:100%; object-fit:cover; display:block; border-radius:7px}
  .thumbs .t .x{position:absolute; right:-6px; top:-6px; width:17px; height:17px; border-radius:50%; border:1.5px solid #fff; background:var(--ink); color:#fff; font-size:9px; line-height:13px; padding:0; cursor:pointer; display:none}
  .thumbs .t.on .x{display:block}
  .thumbs .addT{display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--sub); opacity:1; font-size:18px; font-weight:500}
  .barBtn{flex:0 0 auto; height:32px; border:none; border-radius:8px; background:var(--bg); color:var(--sub); font-size:12.5px; font-weight:600; padding:0 9px; display:flex; align-items:center; gap:4px; cursor:pointer; touch-action:none}
  .barBtn.on{background:var(--acc-soft); color:var(--acc)}
  #cmpBtn:active{background:var(--ink); color:#fff}
  .modes{flex:0 0 auto; display:flex; gap:2px; padding:2px; border-radius:9px; background:var(--bg)}
  .modes button{border:none; background:transparent; color:var(--mute); font-size:12.5px; font-weight:600; padding:6px 10px; border-radius:7px; cursor:pointer}
  .modes button.on{background:var(--surface); color:var(--brown); box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* 자르기 */
  .cropFrame{position:absolute; z-index:4; pointer-events:none; border:2px solid #fff; box-shadow:0 0 0 9999px rgba(20,16,14,.55);
    background-image:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.45)),linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.45)),linear-gradient(90deg,rgba(255,255,255,.45),rgba(255,255,255,.45)),linear-gradient(90deg,rgba(255,255,255,.45),rgba(255,255,255,.45));
    background-size:100% 1px,100% 1px,1px 100%,1px 100%; background-position:0 33.33%,0 66.66%,33.33% 0,66.66% 0; background-repeat:no-repeat}
  .cropPanel{display:none; padding:8px 12px 4px}
  body.cropping .cropPanel{display:block}
  body.cropping #fMode, body.cropping #aMode, body.cropping .amt, body.cropping .adjRow, body.cropping .bar{display:none!important}
  .ratios{display:flex; gap:6px}
  .ratios button{flex:1; position:relative; border:none; background:var(--bg); border-radius:10px; padding:9px 0 7px; font-size:12px; font-weight:600; color:var(--sub); display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; cursor:pointer; min-height:56px}
  .ratios .rb{display:block; border:1.6px solid currentColor; border-radius:3px}
  .ratios em{position:absolute; top:-8px; left:50%; transform:translateX(-50%); font-style:normal; font-size:9.5px; font-weight:700; color:#fff; background:var(--acc); padding:2px 6px; border-radius:6px; white-space:nowrap}
  .ratios button.on{background:var(--acc-soft); color:var(--acc)}
  .cropAct{display:flex; gap:8px; margin-top:10px}
  .mgLine{display:block; margin-top:10px; text-align:center; font-size:12.5px; color:var(--sub); text-decoration:none}
  .mgLine b{color:var(--acc)}
  .mgLine a{display:inline-block; margin-left:4px; padding:3px 8px; border-radius:6px; font-size:11.5px; font-weight:700; color:#fff; text-decoration:none}
  #mNv{background:#03c75a} #mCp{background:#e52528}
  .promo{margin-top:22px; width:min(320px,88%); padding:12px 14px; border-radius:14px; background:var(--cream); box-shadow:inset 0 0 0 1px #f3e3cf; display:flex; align-items:center; gap:10px; text-align:left; cursor:default}
  .pTxt{flex:1; min-width:0}
  .pTxt b{display:block; font-size:13px; color:var(--brown); line-height:1.35}
  .pTxt span{display:block; font-size:11.5px; color:var(--sub); margin-top:3px}
  .pBtns{display:flex; flex-direction:column; gap:5px}
  .pBtns a{text-align:center; text-decoration:none; font-size:12px; font-weight:700; padding:6px 10px; border-radius:8px; color:#fff}
  .pBtns .nv{background:#03c75a} .pBtns .cp{background:#e52528}
  .mgBox{margin-top:6px; padding:12px; border-radius:12px; background:var(--cream); display:flex; flex-direction:column; gap:10px}
  .mgTxt b{display:block; font-size:13.5px; color:var(--brown)}
  .mgTxt span{display:block; font-size:12px; color:var(--sub); margin-top:2px}
  .mgBtns{display:flex; gap:8px}
  .mgBtns a{flex:1; text-align:center; text-decoration:none; font-size:13px; font-weight:700; padding:10px 0; border-radius:10px; color:#fff}
  .mgBtns .nv{background:#03c75a} .mgBtns .cp{background:#e52528}
  .cropAct .pill{flex:1; justify-content:center; padding:11px}

  /* 시작 화면 */
  .empty{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px; cursor:pointer}
  .addBig{display:flex; flex-direction:column; align-items:center; gap:12px; border:none; background:none; color:var(--brown); font-size:16px; font-weight:700; cursor:pointer}
  .addBig span{width:64px; height:64px; border-radius:20px; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(255,107,87,.3)}
  .addBig small{display:block; font-size:12.5px; font-weight:500; color:var(--mute); margin-top:-6px}
  .sample{background:var(--surface); border:none; box-shadow:inset 0 0 0 1px var(--line); color:var(--sub); font-size:13px; font-weight:600; cursor:pointer; padding:9px 14px; border-radius:10px}

  /* 슬라이더 (패널 맨 위) */
  .amt,.adjRow{display:flex; align-items:center; gap:10px; padding:4px 14px 6px; height:36px}
  .amt.hide{display:none}
  .amt .lb,.adjRow b{font-size:12.5px; font-weight:600; color:var(--sub); min-width:28px}
  .adjRow b{min-width:56px}
  .amt input,.adjRow input{flex:1; -webkit-appearance:none; appearance:none; height:3px; border-radius:99px; outline:none; background:var(--line)}
  .amt input{background:linear-gradient(90deg,var(--acc) var(--p,100%), var(--line) var(--p,100%))}
  .amt input::-webkit-slider-thumb,.adjRow input::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px var(--line), 0 1px 4px rgba(0,0,0,.2)}
  .amt input::-moz-range-thumb,.adjRow input::-moz-range-thumb{width:18px; height:18px; border:none; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .amt output,.adjRow output{color:var(--acc); font-size:12.5px; font-weight:700; width:30px; text-align:right; font-variant-numeric:tabular-nums}
  .amt .all,.adjRow .all{border:none; background:var(--bg); color:var(--sub); border-radius:7px; font-size:12px; font-weight:600; padding:6px 9px; cursor:pointer; white-space:nowrap}

  /* 하단 패널 */
  .panel{flex:0 0 auto; padding:6px 0 calc(6px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line)}
  .tabs{display:flex; gap:2px; padding:0 10px; overflow-x:auto; scrollbar-width:none}
  .tabs::-webkit-scrollbar,.chips::-webkit-scrollbar,.tools::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto; border:none; background:transparent; font-size:13px; font-weight:600; color:var(--mute); padding:5px 9px; cursor:pointer; position:relative}
  .tabs button.on{color:var(--ink)}
  .tabs button.on::after{content:''; position:absolute; left:9px; right:9px; bottom:0; height:2px; border-radius:2px; background:var(--acc)}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:10px 12px 0; scrollbar-width:none}
  .chip{position:relative; flex:0 0 auto; width:52px; border:none; background:none; padding:0; cursor:pointer; text-align:center}
  .chip .th{position:relative; display:block; width:52px; height:66px; border-radius:8px; overflow:hidden; background:var(--bg)}
  .chip .th img{width:100%; height:100%; object-fit:cover; display:block}
  .chip .nm{display:block; margin-top:4px; font-size:11px; font-weight:600; color:var(--sub); white-space:nowrap}
  .chip.on .th{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--acc)}
  .chip.on .nm{color:var(--acc)}
  .chip .star{position:absolute; right:-6px; top:-7px; width:24px; height:24px; border-radius:50%; background:var(--surface); box-shadow:0 1px 4px rgba(0,0,0,.18);
    display:none; align-items:center; justify-content:center; z-index:2}
  .chip .star::before{content:''; position:absolute; inset:-8px}
  .chip .star svg{fill:none; stroke:var(--mute)}
  .chip.on .star,.chip .star.fav{display:flex}
  .chip .star.fav svg{fill:var(--acc); stroke:var(--acc)}
  .favHint{flex:0 0 auto; align-self:center; padding:0 8px; font-size:12px; color:var(--mute); line-height:1.5}

  .tools{display:flex; gap:4px; overflow-x:auto; padding:8px 10px 0; scrollbar-width:none}
  .tool{flex:0 0 auto; width:56px; border:none; background:none; padding:0; cursor:pointer; text-align:center; color:var(--sub)}
  .tool .ic{position:relative; width:42px; height:42px; margin:0 auto; border-radius:12px; background:var(--bg); display:flex; align-items:center; justify-content:center}
  .tool .ic svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .tool .nm{display:block; margin-top:4px; font-size:11px; font-weight:600; white-space:nowrap}
  .tool.on{color:var(--acc)} .tool.on .ic{background:var(--acc-soft)}
  .tool .v{position:absolute; right:-5px; top:-5px; min-width:20px; height:16px; padding:0 4px; border-radius:8px; background:var(--acc); color:#fff; font-weight:700; font-size:9.5px; line-height:16px}

  /* 저장 시트 */
  .sheetBg{position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:20; align-items:flex-end; justify-content:center}
  .sheetBg.show{display:flex}
  .sheet{width:100%; max-width:640px; background:var(--surface); border-radius:18px 18px 0 0; padding:20px 18px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px}
  .sheet h3{margin:0; font-size:17px; font-weight:700; text-align:center}
  .sheet p{margin:0 0 6px; text-align:center; color:var(--mute); font-size:12.5px}
  .sheet .pill{width:100%; justify-content:center; padding:14px; font-size:15px; border-radius:12px}
  .sheet .pill.main{background:var(--acc)}
  .sheet .x{background:none; color:var(--mute); box-shadow:none}
  .toast{position:fixed; left:50%; top:calc(60px + env(safe-area-inset-top)); transform:translateX(-50%); background:var(--brown); color:#fff; font-weight:600;
    padding:10px 16px; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.2); display:none; z-index:30; font-size:13.5px; max-width:90vw; text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo"><svg width="30" height="22" viewBox="0 0 30 22"><path d="M8 20h15a6 6 0 0 0 .6-12A7.5 7.5 0 0 0 9.4 6.2 6.9 6.9 0 0 0 8 20z" fill="#fff7ec" stroke="#ff6b57" stroke-width="2.4" stroke-linejoin="round"/><circle cx="12.5" cy="13" r="1.1" fill="#5a3a22"/><circle cx="18.5" cy="13" r="1.1" fill="#5a3a22"/><path d="M14 15.2q1.5 1.3 3 0" fill="none" stroke="#5a3a22" stroke-width="1.1" stroke-linecap="round"/><circle cx="10.6" cy="15" r="1.2" fill="#ffb3a6"/><circle cx="20.4" cy="15" r="1.2" fill="#ffb3a6"/></svg><b>몽글<i>필터</i></b><small>by.미리토퍼</small></div>
    <div class="sp"></div>
    <button class="icoBtn" id="btnUndo" type="button" aria-label="되돌리기" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="icoBtn" id="btnRedo" type="button" aria-label="다시하기" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="pill ghost" id="btnNew" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>사진</button>
    <button class="pill main" id="btnSave" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>저장</button>
  </div>

  <div class="stage" id="stage">
    <div class="wrap" id="wrap"><canvas id="cv"></canvas><img class="out" id="out" alt="" hidden><img class="orig" id="orig" alt=""></div>
    <span class="badge" id="badge" hidden></span>
    <div class="cropFrame" id="cropFrame" hidden></div>
    <span class="zoomTag glass" id="zoomTag">100%</span>
    <div class="spin"></div>
    <div class="hint glass" id="hint" hidden>두 손가락으로 확대 · 두 번 탭하면 확대/원래대로</div>
    <div class="empty" id="empty">
      <button class="addBig" type="button"><span><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>사진 추가하기<small>원본 화질 그대로 저장돼요</small></button>
      <div class="promo" id="promo">
        <div class="pTxt"><b>보정한 사진을 포토마그넷으로</b><span>정사각형(1:1)으로 잘라 바로 주문 · 미리토퍼</span></div>
        <div class="pBtns"><a class="nv" id="pNv" target="_blank" rel="noopener">네이버</a><a class="cp" id="pCp" target="_blank" rel="noopener">쿠팡</a></div>
      </div>
    </div>
  </div>

  <div class="bar" id="bar" hidden>
    <div class="thumbs" id="thumbs"></div>
    <button class="barBtn ico" id="rotBtn" type="button" aria-label="90도 회전"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>회전</span></button>
    <button class="barBtn ico" id="cropBtn" type="button" aria-label="자르기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg><span>자르기</span></button>
    <button class="barBtn" id="sharpBtn" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l8 9-8 9-8-9z"/></svg>선명도</button>
    <div class="modes" id="modes"><button type="button" data-m="f" class="on">필터</button><button type="button" data-m="a">조정</button></div>
    <button class="barBtn ico" id="cmpBtn" type="button" aria-label="원본 비교"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 4v16"/></svg><span>원본</span></button>
  </div>

  <div class="panel" id="panel">
    <div class="amt hide" id="amtRow">
      <span class="lb">강도</span><input type="range" id="amt" min="0" max="100" value="100" aria-label="강도"><output id="amtOut">100</output>
      <button class="all" id="applyAll" type="button" hidden>전체 적용</button>
    </div>
    <div class="adjRow" id="adjRow" hidden>
      <b id="adjName">밝기</b><input type="range" id="adj" min="-100" max="100" value="0" aria-label="조정"><output id="adjOut">0</output>
      <button class="all" id="adjReset" type="button">초기화</button>
    </div>
    <div class="cropPanel" id="cropPanel">
      <div class="ratios" id="ratios"></div>

<script>
const $=id=>document.getElementById(id);
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2300); }
const MAX_PIX=16e6;          // 아이폰 캔버스 한계(약 1,670만 화소) 안쪽
const frame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));

// 화면에 보이는 필터 이름(앱 스타일) — 키는 photo-luts.js 의 이름
const NAMES={'원본':['원본',''],'자연스럽게':['보송','자연스럽게'],'뽀얀 톤업':['뽀얀우유','뽀얀 톤업'],'화이트':['눈송이','하얗게'],
  '파스텔':['마시멜로','파스텔'],'청량':['사이다','청량한 하늘'],'바다':['파도','바다'],'초록 싱그':['말차','싱그러운 초록'],
  '햇살':['꿀햇살','따스한 햇살'],'노을':['노을빛','노을'],'쨍하게':['팝캔디','쨍하게'],'음식':['냠냠','맛있어 보이게'],
  '흐린날':['맑음','흐린 날 살리기'],'어두운사진':['반짝','어두운 사진 밝게'],'역광':['후광','역광 살리기'],'너무밝을때':['그늘','너무 밝을 때'],
  '필름':['필름98','필름 감성'],'흑백':['흑백',''],'미니멀':['구름','깔끔 미니멀'],'라떼':['라떼','브라운 무드'],'오트':['오트밀','뉴트럴 베이지'],
  '린넨':['린넨','차분한 베이지'],'딸기우유':['딸기우유','연핑크'],'생크림':['생크림','화이트 클린'],'브런치':['브런치','음식 감성'],'살구':['살구','살구빛 햇살']};
const en=k=>(NAMES[k]||[k])[0], ko=k=>(NAMES[k]||[k,k])[1];
const TABS=[['추천',['미니멀','라떼','생크림','살구','자연스럽게','뽀얀 톤업','청량','필름']],['전체',null],['카페',['미니멀','라떼','오트','린넨','생크림','브런치','딸기우유']],['인물',['자연스럽게','뽀얀 톤업','살구','화이트','파스텔','햇살','딸기우유']],
  ['풍경',['청량','바다','초록 싱그','흐린날','노을']],['무드',['미니멀','필름','흑백','쨍하게','파스텔','노을']],['음식',['브런치','미니멀','음식','생크림','쨍하게','햇살']],['살리기',['어두운사진','역광','너무밝을때','흐린날']]];
// 즐겨찾기(이 폰에만 저장)
let FAV=new Set(); try{ FAV=new Set(JSON.parse(localStorage.getItem('bbFav')||'[]')); }catch(e){}
function saveFav(){ try{ localStorage.setItem('bbFav',JSON.stringify([...FAV])); }catch(e){} }
TABS.unshift(['즐겨찾기','FAV']);
let tab=FAV.size?0:1;
// 끝이 둥근 통통한 별
const STAR='<svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3.5l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.5l-5.1 2.7 1-5.7-4.1-4 5.7-.8z" stroke-width="2" stroke-linejoin="round"/></svg>';

// ── 필터(LUT) ──
let L=null;
const lutReady=new Promise((res,rej)=>{
  const s=document.createElement('script'); s.src='photo-luts.js?v=3';
  s.onload=()=>{ L=window.MT_LUTS; L.bytes=L.data.map(b=>{ if(!b) return null; const bin=atob(b), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }); res(L); };
  s.onerror=rej; document.head.appendChild(s);
});
function applyLut(ctx,w,h,lut,n,amt){
  const m=n-1, s=m/255, n2=n*n, STEP=Math.max(1,Math.floor(4e6/w)); // 큰 사진은 띠로 나눠 처리
  for(let y0=0;y0<h;y0+=STEP){
    const hh=Math.min(STEP,h-y0), id=ctx.getImageData(0,y0,w,hh), d=id.data;
    for(let i=0;i<d.length;i+=4){
      const r=d[i]*s, g=d[i+1]*s, b=d[i+2]*s;
      let r0=r|0, g0=g|0, b0=b|0; if(r0>=m) r0=m-1; if(g0>=m) g0=m-1; if(b0>=m) b0=m-1;
      const fr=r-r0, fg=g-g0, fb=b-b0;
      const a=(b0*n2+g0*n+r0)*3, a1=a+3, c=a+n*3, c1=c+3, e=a+n2*3, e1=e+3, q=e+n*3, q1=q+3;
      for(let k=0;k<3;k++){
        const x00=lut[a+k]+(lut[a1+k]-lut[a+k])*fr, x10=lut[c+k]+(lut[c1+k]-lut[c+k])*fr,
              x01=lut[e+k]+(lut[e1+k]-lut[e+k])*fr, x11=lut[q+k]+(lut[q1+k]-lut[q+k])*fr;
        const y_0=x00+(x10-x00)*fg, v=y_0+((x01+(x11-x01)*fg)-y_0)*fb;
        d[i+k]=d[i+k]+(v-d[i+k])*amt;
      }
    }
    ctx.putImageData(id,0,y0);
  }
}
// 원본 크기(최대 1,600만 화소) 계산
// 회전(0/90/180/270) 반영한 가로·세로 (자르기 전)
function baseDims(it){ const W=it.img.naturalWidth, H=it.img.naturalHeight; return (it.rot||0)%180 ? [H,W] : [W,H]; }
const cap=(W,H)=>{ const k=Math.min(1,Math.sqrt(MAX_PIX/(W*H))); return [Math.round(W*k),Math.round(H*k)]; };
// 자르기까지 반영한 가로·세로
function dims(it){ const [W,H]=baseDims(it), c=it.crop; return c ? [Math.max(1,W*c.w), Math.max(1,H*c.h)] : [W,H]; }
function fullSize(it){ const [W,H]=dims(it); return cap(W,H); }
// 회전된 원본(캐시)
function rotSrc(it){
  const r=it.rot||0; if(!r) return it.img;
  if(it._rot && it._rotR===r) return it._rot;
  const [W,H]=cap(...baseDims(it)), c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d'); x.translate(W/2,H/2); x.rotate(r*Math.PI/180);
  const dw=r%180?H:W, dh=r%180?W:H; x.drawImage(it.img,-dw/2,-dh/2,dw,dh);
  it._rot=c; it._rotR=r; return c;
}
// 회전 + 자르기 반영한 원본(캐시)
function srcOf(it){
  const rs=rotSrc(it), c=it.crop; if(!c) return rs;
  const k=(it.rot||0)+JSON.stringify(c); if(it._rc && it._rcK===k) return it._rc;
  const SW=rs.naturalWidth||rs.width, SH=rs.naturalHeight||rs.height, [W,H]=fullSize(it);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  cv.getContext('2d').drawImage(rs, c.x*SW, c.y*SH, c.w*SW, c.h*SH, 0,0,W,H);
  it._rc=cv; it._rcK=k; return cv;
}
function dropCache(it){ it._rc=null; it.thumbs=null; it.full=null; it.blob=null; if(it.baseUrl){ URL.revokeObjectURL(it.baseUrl); it.baseUrl=null; } }
function setCrop(it,c){ if(JSON.stringify(it.crop||null)===JSON.stringify(c||null)) return false; it.crop=c||null; dropCache(it); return true; }
function setRot(it,r){
  r=((r%360)+360)%360; if((it.rot||0)===r) return false;
  it.rot=r; it._rot=null; it.crop=null; dropCache(it);
  return true;
}
function drawTo(cv,it,w,h){
  cv.width=w; cv.height=h; const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(srcOf(it),0,0,w,h);
  const amt=it.amt/100;
  if(it.pre>0 && amt>0 && L && L.bytes[it.pre]) applyLut(ctx,w,h,L.bytes[it.pre],L.n,amt);
  if(hasAdj(it.adj)) applyAdj(ctx,w,h,it.adj);
  if(it.adj && it.adj.sharp>0) sharpen(ctx,w,h,it.adj.sharp/100);
}
// 선명도: 주변 평균과의 차이를 키움(언샤프). 큰 사진은 띠로 나눠 처리
function sharpen(ctx,w,h,amt){
  // 반경을 사진 크기에 맞춰서 미리보기(작은 그림)와 원본 저장 결과가 비슷하게 보이도록
  const R=Math.max(1,Math.round(Math.max(w,h)/1400)), k=amt*2.6, STEP=Math.max(1,Math.floor(3e6/w));
  for(let y0=0;y0<h;y0+=STEP){
    const hh=Math.min(STEP,h-y0), ys=Math.max(0,y0-R), ye=Math.min(h,y0+hh+R), H=ye-ys;
    const id=ctx.getImageData(0,ys,w,H), d=id.data, src=new Uint8ClampedArray(d), W4=w*4;
    for(let y=y0-ys; y<y0-ys+hh; y++){
      const up=-Math.min(R,y)*W4, dn=Math.min(R,H-1-y)*W4;
      for(let x=0;x<w;x++){
        const i=y*W4+x*4, lf=-Math.min(R,x)*4, rt=Math.min(R,w-1-x)*4;
        for(let c=0;c<3;c++){ const v=src[i+c]; d[i+c]=v+k*(v-(src[i+up+c]+src[i+dn+c]+src[i+lf+c]+src[i+rt+c])*0.25); }
      }
    }
    ctx.putImageData(id,0,ys,0,y0-ys,w,hh);
  }
}

// ── 세부 조정 ──
const ADJ=[
  {k:'sharp',n:'선명도',ic:'<svg viewBox="0 0 24 24"><path d="M12 3l8 9-8 9-8-9z"/></svg>',min:0},
  {k:'bri',n:'밝기',ic:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'},
  {k:'con',n:'대비',ic:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>'},
  {k:'sat',n:'채도',ic:'<svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>'},
  {k:'warm',n:'따뜻함',ic:'<svg viewBox="0 0 24 24"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>'},
  {k:'tint',n:'색조',ic:'<svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>'},
  {k:'hi',n:'하이라이트',ic:'<svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="2.5"/></svg>'},
  {k:'sh',n:'그림자',ic:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'},
  {k:'fade',n:'바랜 느낌',ic:'<svg viewBox="0 0 24 24"><path d="M4 8h16M4 12h12M4 16h8"/></svg>',min:0},
  {k:'vig',n:'비네팅',ic:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="5"/></svg>'},
  {k:'grain',n:'필름 입자',ic:'<svg viewBox="0 0 24 24"><circle cx="7" cy="7" r=".8"/><circle cx="12" cy="9" r=".8"/><circle cx="17" cy="6" r=".8"/><circle cx="8" cy="13" r=".8"/><circle cx="15" cy="13" r=".8"/><circle cx="6" cy="18" r=".8"/><circle cx="12" cy="17" r=".8"/><circle cx="18" cy="18" r=".8"/></svg>',min:0}];
const hasAdj=a=>a && ADJ.some(t=>a[t.k]);
function applyAdj(ctx,w,h,a){
  const v=k=>(a[k]||0)/100;
  // 밝기·대비·하이라이트·그림자·바랜느낌 → 256단계 표 하나로
  const T=new Uint8ClampedArray(256), bri=v('bri'), con=v('con'), hi=v('hi'), sh=v('sh'), fade=v('fade');
  for(let i=0;i<256;i++){
    let f=i/255;
    f = bri>=0 ? 1-Math.pow(1-f,1+bri*0.9) : Math.pow(f,1-bri*0.9);
    f = f + sh*f*(1-f)*(1-f)*1.35;
    f = f + hi*f*f*(1-f)*1.35;
    f = 0.5+(f-0.5)*(1+con*0.5);
    f = fade*0.16 + f*(1-fade*0.16);
    T[i]=f*255;
  }
  const sat=1+v('sat')*0.8, warm=v('warm'), tint=v('tint'), vig=v('vig'), grain=v('grain')*32;
  const kr=1+warm*0.09, kb=1-warm*0.09, kg=1-tint*0.075, kt=1+tint*0.03;
  const cx=w/2, cy=h/2, STEP=Math.max(1,Math.floor(4e6/w));
  for(let y0=0;y0<h;y0+=STEP){
    const hh=Math.min(STEP,h-y0), id=ctx.getImageData(0,y0,w,hh), d=id.data;
    for(let yy=0;yy<hh;yy++){
      const dy=(y0+yy-cy)/cy, dy2=dy*dy;
      for(let x=0;x<w;x++){
        const i=(yy*w+x)*4;
        let r=T[d[i]], g=T[d[i+1]], b=T[d[i+2]];
        if(sat!==1){ const l=0.299*r+0.587*g+0.114*b; r=l+(r-l)*sat; g=l+(g-l)*sat; b=l+(b-l)*sat; }
        if(warm){ r*=kr; b*=kb; }
        if(tint){ g*=kg; r*=kt; b*=kt; }
        if(vig){ const dx=(x-cx)/cx; let e=(dx*dx+dy2)/2; e=e<0.15?0:(e-0.15)/0.85; e=e*e*(3-2*e);
          if(vig>0){ const m=1-vig*0.5*e; r*=m; g*=m; b*=m; } else { const m=-vig*0.5*e; r+=(255-r)*m; g+=(255-g)*m; b+=(255-b)*m; } }
        if(grain){ const n=(Math.random()-0.5)*grain; r+=n; g+=n; b+=n; }
        d[i]=r; d[i+1]=g; d[i+2]=b;
      }
    }
    ctx.putImageData(id,0,y0);
  }
}
function thumbCanvas(img){ // 세로 3:4 가운데 자르기
  const W=img.naturalWidth||img.width, H=img.naturalHeight||img.height, tw=120, th=160;
  let sw=W, sh=W*th/tw; if(sh>H){ sh=H; sw=H*tw/th; }
  const cv=document.createElement('canvas'); cv.width=tw; cv.height=th;
  cv.getContext('2d').drawImage(img,(W-sw)/2,(H-sh)/2,sw,sh,0,0,tw,th); return cv;
}

// ── 자르기 상태 ──
const CROP={on:false, r:'1:1', f:null, min:1, saved:null};
const RATIOS=[['원본',0],['1:1',1],['4:5',4/5],['3:4',3/4],['9:16',9/16]];

// ── 상태 ──
const items=[]; // {name,img,url,pre,amt,full:{key,cv}|null,blob:{key,b}|null,thumbs[]}
let cur=-1;
const keyOf=it=>(it.rot||0)+'_'+JSON.stringify(it.crop||0)+'_'+it.pre+'_'+(it.pre?it.amt:0)+'_'+JSON.stringify(it.adj||{});
const pick=()=>$('file').click();
$('empty').addEventListener('click',e=>{ if(e.target.closest('.promo')) return; pick(); });
 $('btnNew').onclick=pick;
$('file').addEventListener('change',e=>{ addFiles(e.target.files); e.target.value=''; });

// ── 새로고침해도 사진·보정값 유지 (이 폰 브라우저 안 IndexedDB에만 저장) ──
const DB={db:null};
function dbOpen(){
  if(DB.p) return DB.p;
  DB.p=new Promise(res=>{ try{
    const r=indexedDB.open('bbFilter',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('files'); r.result.createObjectStore('meta'); };
    r.onsuccess=()=>{ DB.db=r.result; res(r.result); }; r.onerror=()=>res(null);
  }catch(e){ res(null); } });
  return DB.p;
}
async function dbDo(store,fn){ const db=await dbOpen(); if(!db) return null;
  return new Promise(res=>{ try{ const tx=db.transaction(store,'readwrite'), st=tx.objectStore(store); const r=fn(st); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>res(null); }catch(e){ res(null); } }); }
let metaT;
function persist(){ clearTimeout(metaT); metaT=setTimeout(()=>dbDo('meta',st=>st.put({cur, items:items.map(it=>({id:it.id,name:it.name,pre:it.pre,amt:it.amt,adj:it.adj,rot:it.rot||0,crop:it.crop||null}))},'state')),400); }
async function restore(){
  const st=await dbDo('meta',s=>s.get('state'));
  if(!st || !st.items || !st.items.length) return false;
  const files=[];
  for(const m of st.items){ const b=await dbDo('files',s=>s.get(m.id)); if(b) files.push({file:new File([b],m.name+'.jpg',{type:b.type||'image/jpeg'}), meta:m}); }
  if(!files.length) return false;
  await addFiles(files.map(f=>f.file), files.map(f=>f.meta), Math.min(st.cur||0, files.length-1));
  return true;
}
async function addFiles(list, metas, selectIdx){
  const fs=[...list].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  let added=0;
  for(let fi=0; fi<fs.length; fi++){
    const f=fs[fi], m=metas&&metas[fi];
    const url=URL.createObjectURL(f), img=new Image();
    try{ img.src=url; await img.decode(); }
    catch(e){ URL.revokeObjectURL(url); toast('이 사진은 열 수 없어요'); continue; }
    const prev=items[cur];
    const id=m?m.id:('p'+Date.now()+'_'+Math.random().toString(36).slice(2,7));
    items.push(m ? {id, name:m.name, img, url, pre:m.pre||0, amt:m.amt??100, adj:m.adj||{}, rot:m.rot||0, crop:m.crop||null, full:null, blob:null, thumbs:null}
                 : {id, name:f.name.replace(/\.\w+$/,''), img, url, pre:prev?prev.pre:0, amt:prev?prev.amt:100, adj:prev?{...prev.adj}:{}, full:null, blob:null, thumbs:null});
    if(!m) dbDo('files',st=>st.put(f,id));
    added++;
  }
  if(!added) return;
  persist();
  $('empty').hidden=true; $('bar').hidden=false; $('btnSave').hidden=false;
  const h=$('hint'); if(!h._shown){ h._shown=1; h.hidden=false; setTimeout(()=>h.style.opacity=0,3200); }
  select(selectIdx!=null ? selectIdx : items.length-added);
}
function renderThumbs(){

// ── 되돌리기 / 다시하기 (필터·강도·조정 변경 기록) ──
let HIS=[], HI=-1, applyingHis=false;
const snapStr=()=>JSON.stringify({cur:items[cur]&&items[cur].id, s:items.map(it=>({id:it.id,pre:it.pre,amt:it.amt,adj:it.adj||{},rot:it.rot||0,crop:it.crop||null}))});
function record(){
  if(applyingHis || !items.length) return;
  const st=snapStr(), prev=HIS[HI];
  if(prev && JSON.parse(prev).s.map(x=>JSON.stringify(x)).join()===JSON.parse(st).s.map(x=>JSON.stringify(x)).join()) return;
  HIS=HIS.slice(0,HI+1); HIS.push(st); if(HIS.length>80) HIS.shift(); HI=HIS.length-1; updUndo();
}
function updUndo(){ $('btnUndo').disabled=HI<=0; $('btnRedo').disabled=HI>=HIS.length-1; }
function goHis(d){
  const n=HI+d; if(n<0||n>=HIS.length) return; HI=n; updUndo();
  const st=JSON.parse(HIS[HI]);
  let rotChanged=false;
  st.s.forEach(m=>{ const it=items.find(x=>x.id===m.id); if(it){ it.pre=m.pre; it.amt=m.amt; it.adj={...m.adj}; if(setRot(it,m.rot||0) && it===items[cur]) rotChanged=true; if(setCrop(it,m.crop||null) && it===items[cur]) rotChanged=true; } });
  const ci=items.findIndex(x=>x.id===st.cur);

  else { const it=items[cur]; if(rotChanged){ setOrig(it); layoutFit(true); renderThumbs(); } setAmtUI(it.amt); buildChips(it); syncMode(); updateView().finally(()=>{ applyingHis=false; }); }

}

function cropFit(reset){
  const it=items[cur]; const sr=stage.getBoundingClientRect(); const [W,H]=dims(it);
  const a=RATIOS.find(x=>x[0]===CROP.r)[1] || W/H, pad=18;
  let fw=sr.width-pad*2, fh=fw/a; if(fh>sr.height-pad*2){ fh=sr.height-pad*2; fw=fh*a; }
  CROP.f={x:(sr.width-fw)/2, y:(sr.height-fh)/2, w:fw, h:fh};
  Object.assign($('cropFrame').style,{left:CROP.f.x+'px',top:CROP.f.y+'px',width:fw+'px',height:fh+'px'});
  V.fit=Math.min(sr.width/W, sr.height/H); V.w=W*V.fit; V.h=H*V.fit;
  wrap.style.width=V.w+'px'; wrap.style.height=V.h+'px';
  CROP.min=Math.max(fw/V.w, fh/V.h);
  if(reset!==false || V.s<CROP.min){ V.s=CROP.min; V.x=CROP.f.x+(fw-V.w*V.s)/2; V.y=CROP.f.y+(fh-V.h*V.s)/2; }
  applyV();
}
function ratioBox(n){ const a=RATIOS.find(x=>x[0]===n)[1]; if(!a) return 'width:16px;height:13px;border-style:dashed'; return a>=1?`width:16px;height:${16/a}px`:`height:18px;width:${18*a}px`; }
function renderRatios(){ $('ratios').innerHTML=RATIOS.map(([n])=>`<button type="button" class="${n===CROP.r?'on':''}" data-r="${n}"><i class="rb" style="${ratioBox(n)}"></i>${n}${n==='1:1'?'<em>마그넷</em>':''}</button>`).join(''); }
$('ratios').addEventListener('click',e=>{ const b=e.target.closest('[data-r]'); if(!b) return; CROP.r=b.dataset.r; renderRatios(); syncMgLine(); cropFit(true); });
function enterCrop(){

  document.body.classList.add('cropping'); $('cropFrame').hidden=false; renderRatios(); syncMgLine();
  setOrig(it); updateView(); cropFit(true);
  if(CROP.saved){ const c=CROP.saved, s=CROP.f.w/c.w/V.w; V.s=Math.max(CROP.min,s); V.x=CROP.f.x-c.x*V.w*V.s; V.y=CROP.f.y-c.y*V.h*V.s; applyV(); }
}
function exitCrop(apply){
  const it=items[cur]; if(!CROP.on) return;

  if(apply){
    const f=CROP.f, iw=V.w*V.s, ih=V.h*V.s;

    c.w=Math.min(c.w,1-c.x); c.h=Math.min(c.h,1-c.y);

// ── 확대·축소·이동 ──
const stage=$('stage'), wrap=$('wrap');
let V={fit:1,s:1,x:0,y:0,w:0,h:0};
function layoutFit(reset){
  const it=items[cur]; if(!it) return;
  if(CROP.on){ cropFit(false); return; }
  const r=stage.getBoundingClientRect(); const [W,H]=dims(it);
  V.fit=Math.min(r.width/W, r.height/H); V.w=W*V.fit; V.h=H*V.fit;
  wrap.style.width=V.w+'px'; wrap.style.height=V.h+'px';
  if(reset){ V.s=1; V.x=(r.width-V.w)/2; V.y=(r.height-V.h)/2; }
  applyV();
}
function clampV(){
  const r=stage.getBoundingClientRect(), sw=V.w*V.s, sh=V.h*V.s;
  if(CROP.on){ const f=CROP.f; V.x=Math.min(f.x, Math.max(f.x+f.w-sw, V.x)); V.y=Math.min(f.y, Math.max(f.y+f.h-sh, V.y)); return; }
  V.x = sw<=r.width ? (r.width-sw)/2 : Math.min(0,Math.max(r.width-sw,V.x));
  V.y = sh<=r.height ? (r.height-sh)/2 : Math.min(0,Math.max(r.height-sh,V.y));
}
let ztT;
function applyV(){ clampV(); wrap.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.s})`;
  const zt=$('zoomTag'); zt.textContent=Math.round(V.s*100)+'%'; zt.classList.toggle('show',V.s>1.01); clearTimeout(ztT); ztT=setTimeout(()=>zt.classList.remove('show'),900); }
function zoomAt(px,py,ns){
  ns=Math.max(CROP.on?CROP.min:1,Math.min(8,ns)); const r=stage.getBoundingClientRect(); px-=r.left; py-=r.top;
  V.x=px-(px-V.x)*ns/V.s; V.y=py-(py-V.y)*ns/V.s; V.s=ns; applyV();
}
const P=new Map(); let pinch=null, lastTap=0, panStart=null;
stage.addEventListener('pointerdown',e=>{
  if(cur<0 || e.target.closest('.thumbs,.cmpBtn,.empty,.modes,.amt,.adjRow,.sharpBtn')) return;
  stage.setPointerCapture(e.pointerId); P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P.size===2){ const [a,b]=[...P.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y), s:V.s}; panStart=null; }
  else if(P.size===1){
    panStart={x:e.clientX,y:e.clientY,vx:V.x,vy:V.y};
    const now=Date.now(); if(!CROP.on && now-lastTap<300){ zoomAt(e.clientX,e.clientY, V.s>1.05?1:2.5); lastTap=0; } else lastTap=now;
  }
});
stage.addEventListener('pointermove',e=>{
  if(!P.has(e.pointerId)) return; P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P.size===2 && pinch){ const [a,b]=[...P.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomAt((a.x+b.x)/2,(a.y+b.y)/2, pinch.s*d/pinch.d); }
  else if(P.size===1 && panStart){ V.x=panStart.vx+e.clientX-panStart.x; V.y=panStart.vy+e.clientY-panStart.y; applyV(); }
});
const up=e=>{ P.delete(e.pointerId); if(P.size<2) pinch=null; if(P.size===1){ const p=[...P.values()][0]; panStart={x:p.x,y:p.y,vx:V.x,vy:V.y}; } if(!P.size) panStart=null; };
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,up));
stage.addEventListener('wheel',e=>{ if(cur<0) return; e.preventDefault(); zoomAt(e.clientX,e.clientY,V.s*(e.deltaY<0?1.15:1/1.15)); },{passive:false});
window.addEventListener('resize',()=>layoutFit(false));
new ResizeObserver(()=>{ if(cur>=0) layoutFit(V.s<1.02); }).observe(stage);

const cmp=$('cmpBtn');
cmp.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); stage.classList.add('cmp'); $('badge').innerHTML='원본'; });
['pointerup','pointerleave','pointercancel'].forEach(t=>cmp.addEventListener(t,()=>{ if(!stage.classList.contains('cmp')) return; stage.classList.remove('cmp'); setBadge(items[cur]); }));
cmp.addEventListener('contextmenu',e=>e.preventDefault());

$('applyAll').onclick=()=>{ const it=items[cur]; items.forEach(x=>{ if(x!==it){ x.pre=it.pre; x.amt=it.amt; x.adj={...it.adj}; } }); record(); persist(); toast(`${items.length}장 모두 ${en(L.names[it.pre])} 적용`); };

// ── 저장 (원본 크기 JPG) ──
function outName(it){ return `${it.name}_${en(L?L.names[it.pre]:'원본').replace(/\s/g,'')}.jpg`; }
async function blobOf(it){
  const key=keyOf(it);
  if(it.blob && it.blob.key===key) return it.blob.b;
  let src=it.full && it.full.key===key ? it.full.cv : null;
  if(!src){ const [W,H]=fullSize(it); src=document.createElement('canvas'); drawTo(src,it,W,H); }
  const b=await new Promise(r=>src.toBlob(r,'image/jpeg',0.95)); return b;
}
let ready=null; // 여러 장은 먼저 만들어 두고 한 번 더 눌러 저장(휴대폰 공유창 제한 때문)
async function doShare(files){
  const mobile=/Android|iPhone|iPad|Macintosh/i.test(navigator.userAgent) && 'ontouchend' in document;
  if(mobile && navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files}); toast('저장했어요. 갤러리에서 확인해 주세요'); return true; }
    catch(e){ if(e.name==='AbortError') return true; }
  }
  for(const f of files){ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),8000); await new Promise(r=>setTimeout(r,350)); }
  toast('저장했어요'); return true;
}
async function saveList(list,btn){
  const t=btn.textContent;
  if(ready && ready.btn===btn){ const f=ready.files; ready=null; closeSheet(); await doShare(f); btn.textContent=t; return; }
  btn.disabled=true; btn.textContent='저장 준비 중...';
  try{
    const files=[]; for(const it of list){ files.push(new File([await blobOf(it)], outName(it), {type:'image/jpeg'})); await frame(); }
    btn.disabled=false;
    // 바로 공유 시도가 막힐 수 있어서, 준비 끝나면 한 번 더 누르게 함
    if(list.length===1 && list[0].blob){ closeSheet(); btn.textContent=t; await doShare(files); return; }
    ready={btn,files}; btn.textContent='준비 완료 · 눌러서 저장';
    $('sheet').classList.add('show'); $('shTitle').textContent='저장 준비 완료';
  }catch(e){ console.error(e); toast('저장에 실패했어요. 다시 시도해 주세요'); btn.disabled=false; btn.textContent=t; }
}
function closeSheet(){ $('sheet').classList.remove('show'); }
function openSheet(){
  ready=null; $('shTitle').textContent='저장하기';
  $('saveOne').textContent='이 사진만 저장'; $('saveAll').textContent=`전체 ${items.length}장 저장`;
  $('saveAll').hidden=items.length<2; $('sheet').classList.add('show');
}
$('btnSave').onclick=openSheet;
$('saveOne').onclick=()=>saveList([items[cur]],$('saveOne'));
$('saveAll').onclick=()=>saveList(items,$('saveAll'));
$('sheetX').onclick=closeSheet; $('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });
showDemoChips();
restore().catch(()=>{});
</script>
